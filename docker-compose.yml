services:
  postgres:
    image: postgres:16-alpine
    container_name: bili-up-dashboard-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: oven/bun:1.3.10-debian
    working_dir: /app
    volumes:
      - ./:/app
      - ${MONITOR_BACKEND_DATA_ROOT:-./packages/monitoring/fixtures/backend}:/data/backend:ro
      - ${MONITOR_FRONTEND_DATA_ROOT:-./packages/monitoring/fixtures/frontend}:/data/frontend:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      MONITOR_DATA_SOURCE: mock
      SOURCE_TIMEZONE: ${SOURCE_TIMEZONE:-Asia/Shanghai}
      API_PORT: 3000
    ports:
      - '${API_PORT:-3000}:3000'
    command: ['bun', 'run', 'apps/api/src/index.ts']
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: oven/bun:1.3.10-debian
    working_dir: /app/apps/web
    volumes:
      - ./:/app
    ports:
      - '${WEB_PORT:-5173}:5173'
    command: ['bun', 'run', 'dev', '--', '--host', '0.0.0.0']
    depends_on:
      - api

volumes:
  postgres_data:
