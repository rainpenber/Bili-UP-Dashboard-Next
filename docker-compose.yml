services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host ports — PostgreSQL is reachable only on the Compose network (api → postgres:5432).
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      MONITOR_DATA_SOURCE: mock
      SOURCE_TIMEZONE: ${SOURCE_TIMEZONE:-Asia/Shanghai}
      MOCK_DATA_ROOT: /mock-data
      MONITOR_ASSETS_ROOT: /mock-data/assets
      API_PORT: 3000
    volumes:
      - ${MOCK_DATA_ROOT:-./packages/monitoring/fixtures/mock-data}:/mock-data:ro
    expose:
      - '3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mock-import:
    image: curlimages/curl:8.5.0
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3000
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        until curl -sf "$$API_URL/api/health"; do echo "waiting for api..."; sleep 2; done
        curl -sf -X POST "$$API_URL/api/v1/imports/csv" \
          -H 'content-type: application/json' \
          -d '{"mode":"apply","sourceTimezone":"Asia/Shanghai"}'
        echo "mock import completed"
    restart: 'no'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
