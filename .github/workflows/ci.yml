name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio_ci
          POSTGRES_PASSWORD: studio_ci_password
          POSTGRES_DB: studio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio_ci -d studio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: studio_ci
      POSTGRES_PASSWORD: studio_ci_password
      POSTGRES_DB: studio_ci
      CI: true
      MONITOR_DATA_SOURCE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Migrate database for E2E
        run: bun run --filter @studio/db migrate

      - name: E2E
        run: bun run e2e

      - name: Build
        run: bun run build
