<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem('studio-theme-mode');
          var a = localStorage.getItem('studio-theme-accent') || 'indigo';
          var d =
            m === 'dark' ||
            (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', d);
          document.documentElement.dataset.accent = a;
          document.documentElement.dataset.themeMode = m || 'system';
        } catch (e) {}
      })();
    </script>
    <title>Studio Ops Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
